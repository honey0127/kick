name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 컴파일(APK 생성) → Robolectric 단위 테스트 → lint 순서로 확인한다.
      # --continue: 한 단계가 실패해도 나머지를 실행해 문제를 한 번에 보여 준다.
      - name: Build, unit test, lint
        run: ./gradlew --no-daemon --continue assembleDebug testDebugUnitTest lintDebug
