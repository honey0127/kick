# YOLO-seg 데이터셋 설정. path 는 train.py 가 절대경로로 바꿔서 넘긴다.
# 클래스 이름은 server/analyzer.py 의 VEHICLE_CLASSES / STUFF_CLASSES 와 같아야 한다.
path: ../data/dataset
train: images/train
val: images/val

names:
  0: bicycle          # 서 있는 자전거 (일반·전기자전거 모두)
  1: fallen_bicycle   # 넘어진 자전거
  2: sidewalk         # 보도면 (보행 가능한 바닥)
  3: road             # 차도
  4: braille_block    # 점자블록 (선형·점형 모두)
  5: crosswalk        # 횡단보도 (진입부 포함)
  6: braille_tile     # (선택) 점자블록 한 장씩 - 라벨하면 cm 실측이 더 정확해짐. 안 해도 braille_block 띠의 이음매로 실측함
